# Maintained source fork of tower-lsp 0.20.0, upstream 7b580128faa39b907db8f40bc53924181887acde.
# Only the Tokio runtime used by this server is retained; all upstream in-crate tests remain.
[package]
name = "tower-lsp"
version = "0.6.1"
authors = ["Eyal Kalderon <ebkalderon@gmail.com>"]
edition = "2021"
rust-version.workspace = true
description = "Language Server Protocol implementation based on Tower"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/ebkalderon/tower-lsp"
repository = "https://github.com/ebkalderon/tower-lsp"
publish = false

[features]
proposed = ["lsp-types/proposed"]

[dependencies]
async-trait = "0.1"
auto_impl = "1.0"
bytes = "1.0"
dashmap = "5.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httparse = "1.8"
lsp-types = "0.94.1"
memchr = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.17"
tokio-util = { version = "0.7", features = ["codec"] }
tower-lsp-macros = "0.9"
tower = { version = "0.4", default-features = false, features = ["util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.17", features = ["io-util", "io-std", "macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"

# Preserve the upstream code's style policy without changing the application's stricter lints.
# Maintained production code must also retain the repository's no-unsafe/no-unwrap boundaries.
[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

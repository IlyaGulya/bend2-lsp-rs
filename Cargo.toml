[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
# tower-lsp 0.20 constructs LSP structures with compatibility-only deprecated fields.
deprecated = { level = "allow", priority = 1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Bend import paths accept only the canonical lowercase source suffix.
case_sensitive_file_extension_comparisons = "allow"

[package]
name = "bend2-lsp"
version = "0.5.1"
edition.workspace = true
description = "Rust language server for Bend 2"
license = "Apache-2.0"
repository = "https://github.com/IlyaGulya/bend2-lsp-rs"
rust-version.workspace = true

[[bin]]
name = "bend2-lsp"
path = "src/main.rs"

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3.3", optional = true }
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-std", "io-util", "sync", "signal"] }
url = "2"
tempfile = "3"
serde_json = "1"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[dev-dependencies]
iai-callgrind = "=0.16.1"

[[bench]]
name = "analysis"
harness = false



[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
strip = false

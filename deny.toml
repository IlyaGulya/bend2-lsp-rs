[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
# Keep unavoidable transitive duplicate versions visible without blocking updates.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

# Reviewed permissive build tools for libproc 0.14.11's macOS process API bindings.
# Keep exact versions: upgrades require another license review. These exceptions
# do not waive redistribution notices, advisory checks, or source restrictions.
[[licenses.exceptions]]
crate = "bindgen@0.72.1"
allow = ["BSD-3-Clause"]

# bindgen -> clang-sys uses libloading to load libclang while generating bindings.
[[licenses.exceptions]]
crate = "libloading@0.8.9"
allow = ["ISC"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
# Keep unavoidable transitive duplicate versions visible without blocking updates.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

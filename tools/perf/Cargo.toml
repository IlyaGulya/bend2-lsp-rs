[package]
name = "bend2-perf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Hosted performance collectors and policy validation for Bend 2 LSP"
repository = "https://github.com/IlyaGulya/bend2-lsp-rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
url = "2"

[lints]
workspace = true

[[test]]
name = "transport-fixture"
path = "tests/transport_fixture.rs"
harness = false

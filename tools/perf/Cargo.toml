[package]
name = "bend2-perf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Hosted performance collectors and policy validation for Bend 2 LSP"
repository = "https://github.com/IlyaGulya/bend2-lsp-rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
encoding_rs_io = "0.1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["psapi"] }

[lints]
workspace = true

[[test]]
name = "transport-fixture"
path = "tests/transport_fixture.rs"
harness = false

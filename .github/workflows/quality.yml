name: quality

on:
  pull_request:
    # Label changes retrigger the unprivileged producer; its trusted completion
    # reevaluates policy without giving PR code a write token.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install pinned quality tools
        run: ./scripts/install-tools.sh
      - name: Run quality gates
        run: ./scripts/quality

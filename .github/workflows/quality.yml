name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild-tools:
        description: Rebuild tools without restoring or saving installed binaries
        type: boolean
        default: false

permissions: {}

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Identify Rust dependency paths and configure sccache
        id: ci-cache
        env:
          ENABLE_SCCACHE: 'true'
          CACHE_WRITABLE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          BUILDFETCH_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.BUILDFETCH_TOKEN_READWRITE || secrets.BUILDFETCH_TOKEN_READONLY }}
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Install pinned sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.18.0
      - name: Configure isolated quality tool installs
        id: tool-identity
        run: |
          printf 'CARGO_INSTALL_ROOT=%s/ci-quality-tools/cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOBIN=%s/ci-quality-tools/go/bin\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/ci-quality-tools/cargo/bin" "$RUNNER_TEMP/ci-quality-tools/go/bin" >> "$GITHUB_PATH"
          printf 'go-version=%s\n' "$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned quality tools and Cargo install metadata
        if: ${{ !inputs.rebuild-tools }}
        id: tool-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-quality-tools
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ steps.tool-identity.outputs.go-version }}-${{ hashFiles('scripts/install-tools.sh') }}
          restore-keys: |
            quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ steps.tool-identity.outputs.go-version }}-
      - name: Install pinned quality tools
        env:
          # Keep cold tool builds separate from the repository's target directory.
          CARGO_TARGET_DIR: ${{ runner.temp }}/ci-quality-tool-build
        run: |
          ./scripts/install-tools.sh
          sccache --show-stats --stats-format=json
      - name: Provision checksum-pinned genuine Bend 2.0.37
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bootstrap_bend.py --target x86_64-unknown-linux-gnu --destination "$RUNNER_TEMP/bend-2.0.37" --github-env "$GITHUB_ENV"
      - name: Run quality gates
        run: ./scripts/quality
      - name: Stress repeated 10000-file workspace lifecycles
        id: workspace-stress
        run: cargo run --locked --package bend2-perf -- lifecycle-stress --binary target/debug/bend2-lsp --output target/workspace-stress/report.json
      - name: Preserve workspace lifecycle stress evidence
        if: always() && steps.workspace-stress.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-lifecycle-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/workspace-stress/
          if-no-files-found: error
          retention-days: 14
      - name: Install checksum-pinned Neovim
        run: python3 scripts/bootstrap_neovim.py --destination target/neovim
      - name: Run real Neovim native LSP E2E
        run: python3 scripts/neovim_e2e.py --nvim target/neovim/bin/nvim --binary target/debug/bend2-lsp --log-dir target/neovim-e2e
      - name: Upload Neovim E2E failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neovim-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/neovim-e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save trusted Cargo downloads
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
      - name: Save trusted pinned quality tools
        if: success() && !inputs.rebuild-tools && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-quality-tools
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}
  native-compiler-e2e:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
            python: python
    defaults:
      run:
        shell: bash
    env:
      BEND_NO_TELEMETRY: '1'
      EXPECTED_ARCH: ${{ matrix.arch }}
      NATIVE_TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
        run: test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
      - name: Install pinned native Rust toolchain
        run: |
          rustup toolchain install "1.98.1-$NATIVE_TARGET" --profile minimal
          rustup override set "1.98.1-$NATIVE_TARGET"
          "$PYTHON" -c 'import os, subprocess; host = next(line.removeprefix("host: ") for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines() if line.startswith("host: ")); assert host == os.environ["NATIVE_TARGET"], host'
      - name: Provision checksum-pinned genuine Bend 2.0.37
        id: compiler-provision
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$PYTHON" scripts/bootstrap_bend.py --target "$NATIVE_TARGET" --destination "$RUNNER_TEMP/bend-2.0.37" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"'
      - name: Preserve actual native compiler source and runtime identity
        if: always() && steps.compiler-provision.outputs.compiler-evidence-present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genuine-bend-2.0.37-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.compiler-provision.outputs.compiler-evidence-path }}/compiler-build-identity.json
            ${{ steps.compiler-provision.outputs.compiler-evidence-path }}/compiler-embedded-source.js
            ${{ runner.os == 'Windows' && format('{0}/bin', steps.compiler-provision.outputs.compiler-evidence-path) || '' }}
            ${{ runner.os == 'Windows' && format('{0}/bend2', steps.compiler-provision.outputs.compiler-evidence-path) || '' }}
            ${{ runner.os == 'Windows' && format('{0}/guide', steps.compiler-provision.outputs.compiler-evidence-path) || '' }}
          if-no-files-found: error
          retention-days: 7
      - name: Run mandatory real-compiler stdio E2Es
        run: cargo test --locked --test native_compiler_diagnostics --test native_law_ranges --test compiler_multi_error
      - name: Run saved-lint process and publication lifecycle E2Es
        run: cargo test --locked --test bend_lint_protocol
      - name: Verify notification ordering under contended lint cleanup
        run: cargo test --locked --lib notification_ordering_tests
      - name: Provision checksum-pinned standalone bend-lint and native Bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$PYTHON" scripts/bootstrap_bend_lint.py --target "$NATIVE_TARGET" --destination "$RUNNER_TEMP/bend-lint-0.1.0" --github-env "$GITHUB_ENV"'
      - name: Preserve actual native linter package and runtime identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genuine-bend-lint-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bend-lint-0.1.0/lint-build-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: Run genuine standalone lint diagnostics and explicit dangerous action E2E
        id: genuine-lint
        env:
          BEND2_LINT_TEST_FAILURE_DIR: ${{ runner.temp }}/bend-lint-failure
        run: cargo test --locked --test bend_lint_e2e -- --ignored --nocapture
      - name: Capture the genuine Windows ARM native exception
        if: failure() && steps.genuine-lint.outcome == 'failure' && matrix.target == 'aarch64-pc-windows-msvc'
        timeout-minutes: 12
        run: '"$PYTHON" scripts/diagnose_windows_lint.py --evidence-dir "$RUNNER_TEMP/bend-lint-failure"'
      - name: Preserve genuine analyzer failure evidence
        if: failure() && steps.genuine-lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genuine-lint-failure-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bend-lint-failure/
          if-no-files-found: error
          retention-days: 7
  legacy-native-compiler-e2e:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native macOS ARM64 runner
        env:
          ACTUAL_OS: ${{ runner.os }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          test "$ACTUAL_OS" = "macOS"
          test "$ACTUAL_ARCH" = "ARM64"
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Provision checksum-pinned legacy Bend 2.0.36
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bootstrap_bend.py --version 2.0.36 --target aarch64-apple-darwin --destination "$RUNNER_TEMP/bend-2.0.36" --github-env "$GITHUB_ENV"
      - name: Preserve genuine 2.0.36 stdio and LAW coverage
        run: cargo test --locked --test native_compiler_diagnostics --test native_law_ranges

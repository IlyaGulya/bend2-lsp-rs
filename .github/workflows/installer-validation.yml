name: installer-validation

on:
  pull_request:
    paths:
      - .github/workflows/installer-validation.yml
      - .github/workflows/release-binaries.yml
      - scripts/ci-cache.sh
      - scripts/bootstrap_nextest.py
      - scripts/bootstrap_bend.py
      - scripts/bootstrap_bend_source.py
      - scripts/bend_compiler_pins.json
      - scripts/quality
      - .github/workflows/quality.yml
      - scripts/release.py
      - scripts/test_release.py
      - scripts/dist_installers.py
      - scripts/installer_e2e.py
      - tools/perf/**
      - scripts/install-tools.sh
      - dist-workspace.toml
      - src/server/compiler_backend.rs
      - src/server/compiler_backend/**
      - src/server/compiler.rs
      - tests/native_compiler_diagnostics.rs
      - tests/native_law_ranges.rs
      - tests/compiler_multi_error.rs
      - tests/support/**
      - Cargo.toml
      - Cargo.lock

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Select isolated nightly identity for the exact PR merge SHA
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "tag=nightly-$(date -u +%Y-%m-%d)-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  native-installers:
    needs: prepare
    permissions:
      contents: read
    uses: $/.github/workflows/release-binaries.yml
    with:
      sha: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: nightly
    secrets:
      BUILDFETCH_TOKEN_READONLY: ${{ secrets.BUILDFETCH_TOKEN_READONLY }}

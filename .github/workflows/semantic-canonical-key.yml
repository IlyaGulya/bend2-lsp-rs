name: semantic-canonical-key
run-name: semantic-canonical-key / ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - feat/semantic-canonical-key-qualification

permissions: {}

jobs:
  equivalence-and-cost:
    if: github.repository == 'IlyaGulya/bend2-lsp-rs'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision checksum-pinned native compiler sources and Bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/semantic_install.py --download-runtime --report target/canonical-key/installation.json
      - name: Verify native key, source-alias and worker contracts
        run: python3 scripts/semantic_install.py --check --native-contracts --report target/canonical-key/native-contracts.json
      - name: Compare exact native keys across the full corpus and record paired micro-cost
        run: python3 scripts/diagnostics/canonical_key.py --output target/canonical-key/qualification
      - name: Preserve source-bound proof and failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-canonical-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/canonical-key/
          if-no-files-found: error
          retention-days: 14

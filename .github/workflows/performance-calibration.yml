# Experimental native replay proof only; never merge this workflow replacement.
name: paired-native-replay-proof

on:
  workflow_dispatch:

permissions: {}

jobs:
  replay:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      PERF_TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      ACTUAL_ARCH: ${{ runner.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact native source and Rust host
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          mkdir -p target/paired-native
          printf '%s\n' "$GITHUB_SHA" > target/paired-native/source-sha.txt
          rustup toolchain install "1.98.1-$PERF_TARGET" --profile minimal
          rustup override set "1.98.1-$PERF_TARGET"
          rustc -vV | tee target/paired-native/rustc.txt
          host="$(rustc -vV)"
          [[ "$host" == *$'\nhost: '"$PERF_TARGET"$'\n'* ]]
      - name: Exercise retained Linux evidence through actual native CLI
        run: |
          cargo test --locked -p bend2-perf --no-fail-fast \
            --test paired_contract --test paired_admission --test paired_dashboard --test paired_collector \
            2>&1 | tee target/paired-native/tests.log
      - name: Retain native test evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paired-replay-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/paired-native/
          if-no-files-found: error
          retention-days: 14

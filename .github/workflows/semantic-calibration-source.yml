name: semantic-calibration-source
run-name: semantic-calibration-source / v8 / 12afbf96 / ${{ github.sha }}

on:
  push:
    branches:
      - diagnostic/semantic-v8-calibration-12afbf96

permissions: {}

concurrency:
  group: semantic-calibration-source-${{ github.ref }}
  cancel-in-progress: false

# Candidate checkout and workflow revision are separate recorded identities.
# Never replace GITHUB_SHA or reinterpret historical v7 evidence as v8.
env:
  SOURCE_SHA: 12afbf96e8e5ed18462de42bdc1b265791673ff9

jobs:
  calibration:
    if: >-
      github.repository == 'IlyaGulya/bend2-lsp-rs' &&
      github.ref == 'refs/heads/diagnostic/semantic-v8-calibration-12afbf96'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [semantic-01, semantic-02, semantic-03, semantic-04, semantic-05]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact isolated candidate checkout
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_SHA"
          printf 'Candidate checkout: %s\nWorkflow revision: %s\n' "$actual" "$GITHUB_SHA"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install pinned semantic runtime
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_JOB: ${{ matrix.job }}
        run: python3 scripts/semantic_gate.py install --output "target/semantic-calibration/$CALIBRATION_JOB"
      - name: Prepare once and record separate setup cost
        env:
          CALIBRATION_JOB: ${{ matrix.job }}
        run: python3 scripts/semantic_gate.py setup --output "target/semantic-calibration/$CALIBRATION_JOB"
      - name: Record warm setup separately before measurements
        env:
          CALIBRATION_JOB: ${{ matrix.job }}
        run: python3 scripts/semantic_gate.py setup --output "target/semantic-calibration/$CALIBRATION_JOB/warm-setup"
      - name: Collect four sequential complete runs without concurrent builds
        env:
          SEMANTIC_CALIBRATION_JOB: ${{ matrix.job }}
        run: |
          for ordinal in 1 2 3 4; do
            python3 scripts/semantic_gate.py run --calibration-run-ordinal "$ordinal" --output "target/semantic-calibration/$SEMANTIC_CALIBRATION_JOB/run-$ordinal"
          done
      - name: Measure startup and fixed 128 256 512 project scaling independently
        # The approved v8 hard bound is uniformly 240s, including all 512 projects.
        env:
          SEMANTIC_CALIBRATION_JOB: ${{ matrix.job }}
        run: python3 scripts/semantic_gate.py scaling --output "target/semantic-calibration/$SEMANTIC_CALIBRATION_JOB/scaling"
      - name: Preserve every raw run including failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-calibration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
          path: target/semantic-calibration/${{ matrix.job }}/
          if-no-files-found: warn
          retention-days: 14

  calibration-report:
    if: >-
      always() &&
      github.repository == 'IlyaGulya/bend2-lsp-rs' &&
      github.ref == 'refs/heads/diagnostic/semantic-v8-calibration-12afbf96'
    needs: calibration
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact isolated candidate checkout
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_SHA"
          printf 'Candidate checkout: %s\nWorkflow revision: %s\n' "$actual" "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: semantic-calibration-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/semantic-calibration-input
      - name: Validate independent evidence without adjusting policy
        run: python3 scripts/semantic_gate.py calibrate-directory target/semantic-calibration-input --output target/semantic-calibration-report/report.json
      - name: Preserve calibration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-calibration-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/semantic-calibration-report/
          if-no-files-found: error
          retention-days: 14

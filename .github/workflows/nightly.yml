name: nightly

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Compute immutable nightly identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_DATE: ${{ github.event.workflow_run.created_at }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          date="${SOURCE_DATE:0:10}"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          printf 'tag=nightly-%s-%s\n' "$date" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  binaries:
    needs: prepare
    uses: ./.github/workflows/release-binaries.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: nightly
  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Publish complete immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: nightly
        run: python3 scripts/release.py publish

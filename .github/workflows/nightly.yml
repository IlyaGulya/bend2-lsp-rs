name: nightly

on:
  # Only a successful same-repository main push can reach privileged release jobs.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: nightly-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions: {}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Compute immutable nightly identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_DATE: ${{ github.event.workflow_run.created_at }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          date="${SOURCE_DATE:0:10}"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          printf 'tag=nightly-%s-%s\n' "$date" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  binaries:
    permissions:
      contents: read
    needs: prepare
    uses: $/.github/workflows/release-binaries.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: nightly
  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Publish complete immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: nightly
        run: python3 scripts/release.py publish

name: cache-warm

on:
  push:
    branches: [main]
    paths:
      - scripts/ci-cache.sh
      - scripts/check_buildfetch.py
      - .github/workflows/cache-warm.yml
      - .github/workflows/release-binaries.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/**
      - scripts/install-tools.sh
      - scripts/bootstrap_nextest.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-warm-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Select unpublished native validation identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "tag=nightly-$(date -u +%Y-%m-%d)-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  native-caches:
    needs: prepare
    permissions:
      contents: read
    uses: $/.github/workflows/release-binaries.yml
    with:
      sha: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: nightly
    secrets:
      BUILDFETCH_TOKEN_READONLY: ${{ secrets.BUILDFETCH_TOKEN_READONLY }}
      BUILDFETCH_TOKEN_READWRITE: ${{ secrets.BUILDFETCH_TOKEN_READWRITE }}
  buildfetch-probe:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Configure BuildFetch writer
        env:
          ENABLE_SCCACHE: 'true'
          CACHE_WRITABLE: 'true'
          BUILDFETCH_TOKEN: ${{ secrets.BUILDFETCH_TOKEN_READWRITE }}
        run: |
          test -n "$BUILDFETCH_TOKEN"
          bash scripts/ci-cache.sh
      - name: Install pinned sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.18.0
      - name: Prove remote compiler artifact write
        run: |
          python3 scripts/check_buildfetch.py write --directory "$RUNNER_TEMP/buildfetch-probe" --report target/buildfetch-probe/write.json
          sccache --stop-server
      - name: Configure independent readonly cache client
        env:
          ENABLE_SCCACHE: 'true'
          CACHE_WRITABLE: 'false'
          BUILDFETCH_TOKEN: ${{ secrets.BUILDFETCH_TOKEN_READONLY }}
        run: |
          test -n "$BUILDFETCH_TOKEN"
          bash scripts/ci-cache.sh
      - name: Prove readonly remote hit and execute cached code
        run: python3 scripts/check_buildfetch.py read --directory "$RUNNER_TEMP/buildfetch-probe" --report target/buildfetch-probe/read.json
      - name: Preserve remote cache probe statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildfetch-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/buildfetch-probe/
          if-no-files-found: warn
          retention-days: 14
  performance-tools:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Identify Rust dependency paths without object caching
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh', 'scripts/ci-cache.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Configure isolated Iai runner install
        run: |
          printf 'CARGO_INSTALL_ROOT=%s/ci-performance-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/ci-performance-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Restore pinned Iai runner and Cargo install metadata
        id: runner-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-performance-tools
          key: iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-${{ hashFiles('scripts/install-tools.sh', 'rust-toolchain.toml', 'scripts/ci-cache.sh') }}
      - name: Install matching Iai-Callgrind runner
        run: ./scripts/install-tools.sh performance
      - name: Save trusted Cargo downloads
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
      - name: Save trusted pinned Iai runner
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.runner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-performance-tools
          key: ${{ steps.runner-cache.outputs.cache-primary-key }}

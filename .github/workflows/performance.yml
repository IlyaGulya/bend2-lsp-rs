name: performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact baseline commit for the fresh comparison
        required: true
        type: string
      request_performance_exception:
        description: Explicitly request protected owner review if this comparison regresses
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  compare:
    name: Callgrind measurement
    outputs:
      status: ${{ steps.classify.outputs.status }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      run_id: ${{ steps.classify.outputs.run_id }}
      environment_id: ${{ steps.classify.outputs.environment_id }}
      prior_approval_count: ${{ steps.classify.outputs.prior_approval_count }}
      run_attempt: ${{ steps.classify.outputs.run_attempt }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REQUEST_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
      MODE: callgrind
      MEASUREMENT_METHOD: paired-median-105-v1
      SCENARIO: analysis-hot-paths
      SELECTED_TARGET: all
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      PERF_TARGET: x86_64-unknown-linux-gnu
      EXCEPTION_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.request_performance_exception }}
      PERF_RUNNER: ubuntu-24.04
      PERF_ROOT: target/iai/bend2-lsp/analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact comparison source identities
        run: |
          for sha in "$BASE_SHA" "$CANDIDATE_SHA" "$WORKFLOW_HEAD_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'An exact 40-character source SHA is required; admission denied.\n' >&2
              exit 1
            }
          done
      - name: Configure isolated profiler installation
        run: printf 'VALGRIND_INSTALL_ROOT=%s/ci-valgrind\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore source-bound Valgrind 3.27.1
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VALGRIND_INSTALL_ROOT }}
          key: valgrind-v1-${{ runner.os }}-${{ runner.arch }}-3.27.1-4522e345fe31bc10478f21ab261cf7b3e509d80fe98fd0c7c9778ac9a9f90e1d8fa6e54a37c2e23114c01c95131035103fc1e78661710d7f45f5d564a31c1015-${{ hashFiles('scripts/install-tools.sh', 'scripts/install-valgrind.sh') }}
      - name: Install and validate pinned Valgrind
        run: |
          ./scripts/install-tools.sh valgrind
          test -x "$VALGRIND_INSTALL_ROOT/bin/callgrind_annotate"
          version="$("$VALGRIND_INSTALL_ROOT/bin/valgrind" --version)"
          [[ "$version" == valgrind-3.27.1 ]]
          printf '%s/bin\n' "$VALGRIND_INSTALL_ROOT" >> "$GITHUB_PATH"
          mkdir -p "$PERF_ROOT"
          printf '%s\n' "$version" | tee "$PERF_ROOT/valgrind-version.txt"
          cp "$VALGRIND_INSTALL_ROOT/provenance.json" "$PERF_ROOT/valgrind-provenance.json"
          cat "$PERF_ROOT/valgrind-provenance.json"
          printf 'Pinned profiler: %s; source and installed-byte hashes are preserved in valgrind-provenance.json.\n\n' \
            "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Identify Rust dependency paths without object caching
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Configure isolated Iai runner install
        run: |
          printf 'CARGO_INSTALL_ROOT=%s/ci-performance-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/ci-performance-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Restore pinned Iai runner and Cargo install metadata
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-performance-tools
          key: iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-${{ hashFiles('scripts/install-tools.sh') }}
          restore-keys: |
            iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-
      - name: Install matching Iai-Callgrind runner
        run: ./scripts/install-tools.sh performance
      - name: Build candidate Rust performance tooling independently
        run: |
          mkdir -p "$PERF_ROOT"
          cargo build --locked --release -p bend2-perf --target-dir "$RUNNER_TEMP/perf-tools-target" \
            2>&1 | tee "$PERF_ROOT/tool-build.log"
          cp "$RUNNER_TEMP/perf-tools-target/release/bend2-perf" "$RUNNER_TEMP/bend2-perf"
      - name: Prepare durable Callgrind evidence inventory
        run: '"$RUNNER_TEMP/bend2-perf" workflow prepare'
      - name: Prepare exact main source
        id: baseline
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/paired-main" "$BASE_SHA"
          [[ "$(git -C "$RUNNER_TEMP/paired-main" rev-parse HEAD)" == "$BASE_SHA" ]]
      - name: Compare pull request with main
        id: candidate
        # Collection, regression and uncertainty retain distinct exit codes.
        # Only the post-inventory validator may classify the retained evidence.
        continue-on-error: true
        timeout-minutes: 210
        run: |
          benchmark_status=0
          "$RUNNER_TEMP/bend2-perf" paired collect \
            --baseline-source "$RUNNER_TEMP/paired-main" \
            --candidate-source "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/paired-work" \
            --output-dir "$PERF_ROOT" || benchmark_status=$?
          printf 'benchmark_exit_code=%s\n' "$benchmark_status" >> "$GITHUB_OUTPUT"
          policy_status=0
          "$RUNNER_TEMP/bend2-perf" paired report "$PERF_ROOT" \
            --json-output "$PERF_ROOT/callgrind-policy.json" \
            --markdown-output "$PERF_ROOT/callgrind-policy.md" || policy_status=$?
          printf 'policy_exit_code=%s\n' "$policy_status" >> "$GITHUB_OUTPUT"
          if [[ -f "$PERF_ROOT/callgrind-policy.md" ]]; then
            cat "$PERF_ROOT/callgrind-policy.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$benchmark_status" != 0 ]]; then
            exit "$benchmark_status"
          fi
          exit "$policy_status"
      - name: Record unchanged Callgrind gate outcomes and raw identities
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: '"$RUNNER_TEMP/bend2-perf" workflow finalize'
      - name: Validate source-bound measurement and explicitly requested review protection
        id: classify
        env:
          BENCHMARK_EXIT_CODE: ${{ steps.candidate.outputs.benchmark_exit_code }}
          POLICY_EXIT_CODE: ${{ steps.candidate.outputs.policy_exit_code }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
        run: |
          "$RUNNER_TEMP/bend2-perf" admission measurement \
            --root "$PERF_ROOT" \
            --measurement-method paired-median-105-v1 \
            --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --head-sha "$WORKFLOW_HEAD_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow-sha "$WORKFLOW_SHA" \
            --benchmark-exit-code "$BENCHMARK_EXIT_CODE" \
            --policy-exit-code "$POLICY_EXIT_CODE" \
            > "$PERF_ROOT/admission-measurement.json"
          status="$(jq -er '.status' "$PERF_ROOT/admission-measurement.json")"
          {
            printf '### Callgrind measurement: %s\n\n' "$status"
            printf 'Valid collection is not admission of a regression or an inconclusive result.\n\n'
            printf -- "- Base: \`%s\`\n- Merge candidate: \`%s\`\n- PR head: \`%s\`\n" \
              "$BASE_SHA" "$CANDIDATE_SHA" "$WORKFLOW_HEAD_SHA"
            printf -- "- Run: \`%s\`, attempt: \`%s\`\n- Benchmark exit: \`%s\`; policy exit: \`%s\`\n\n" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$BENCHMARK_EXIT_CODE" "$POLICY_EXIT_CODE"
            jq -r '.failures[] | "- \(.function_name)/\(.id // "-") \(.metric): \(.classification)"' \
              "$PERF_ROOT/admission-measurement.json"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            passed)
              printf '\nOrdinary policy passed; no exception review is needed.\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            inconclusive)
              printf '\nThe fixed series does not establish a pass or a regression. Admission is blocked; owner exceptions do not apply.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            regression)
              printf '\nOrdinary policy failed; admission is blocked. Exception review is available only through an explicitly requested manual comparison.\n' >> "$GITHUB_STEP_SUMMARY"
              if [[ "$EXCEPTION_REQUESTED" == true ]]; then
                # Public read only: no token or secret is exposed to PR code.
                curl --fail --silent --show-error \
                  --header 'Accept: application/vnd.github+json' \
                  --header 'X-GitHub-Api-Version: 2022-11-28' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/performance-exception" \
                  --output "$PERF_ROOT/performance-exception-environment.json"
                "$RUNNER_TEMP/bend2-perf" admission environment \
                  --owner-id "$OWNER_ID" --input "$PERF_ROOT/performance-exception-environment.json"
                environment_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' \
                  "$PERF_ROOT/performance-exception-environment.json")"
                [[ "$OWNER_ID" =~ ^[1-9][0-9]*$ && "$environment_id" =~ ^[1-9][0-9]*$ ]]
                curl --fail --silent --show-error \
                  --header 'Accept: application/vnd.github+json' \
                  --header 'X-GitHub-Api-Version: 2022-11-28' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
                  --output "$PERF_ROOT/performance-exception-prior-approvals.json"
                prior_approval_count="$(jq -er --argjson owner "$OWNER_ID" --argjson environment "$environment_id" '
                  def valid_id: type == "number" and . > 0 and floor == .;
                  if type != "array" then error("Approval history must be an array")
                  elif all(.[];
                    type == "object" and (.state == "approved" or .state == "rejected" or .state == "pending") and
                    (.user | type == "object") and (.user.id | valid_id) and
                    (.environments | type == "array") and
                    all(.environments[]; type == "object" and (.id | valid_id) and (.name | type == "string")))
                  then [.[] | select(.state == "approved" and .user.id == $owner and
                    any(.environments[]; .id == $environment and .name == "performance-exception"))] | length
                  else error("Malformed approval history")
                  end' "$PERF_ROOT/performance-exception-prior-approvals.json")"
                [[ "$prior_approval_count" =~ ^(0|[1-9][0-9]*)$ ]]
              fi
              ;;
            *)
              printf 'Invalid measurement classification: %s\n' "$status" >&2
              exit 1
              ;;
          esac
          # Publish nothing before evidence and any required protection validate.
          jq -r 'to_entries[] | select(.key == "status" or .key == "base_sha" or .key == "candidate_sha" or .key == "head_sha" or .key == "run_id" or .key == "run_attempt") | "\(.key)=\(.value)"' \
            "$PERF_ROOT/admission-measurement.json" >> "$GITHUB_OUTPUT"
          if [[ "$status" == regression && "$EXCEPTION_REQUESTED" == true ]]; then
            printf 'environment_id=%s\nprior_approval_count=%s\n' \
              "$environment_id" "$prior_approval_count" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve raw baseline and candidate Callgrind evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/iai/bend2-lsp/analysis/
          if-no-files-found: error
          retention-days: 14

  review-exception:
    name: Review exact-run performance exception
    needs: compare
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_performance_exception && needs.compare.result == 'success' && needs.compare.outputs.status == 'regression' }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: performance-exception
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # GitHub binds environment approval to this workflow run and commit.
      # No checkout, artifact download, PR code, token, or secret is needed.
      - name: Require fresh explicit owner approval before accepting the source and run
        env:
          BASE_SHA: ${{ needs.compare.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.compare.outputs.candidate_sha }}
          HEAD_SHA: ${{ needs.compare.outputs.head_sha }}
          REVIEWED_RUN_ID: ${{ needs.compare.outputs.run_id }}
          REVIEWED_RUN_ATTEMPT: ${{ needs.compare.outputs.run_attempt }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
          ENVIRONMENT_ID: ${{ needs.compare.outputs.environment_id }}
          PRIOR_APPROVAL_COUNT: ${{ needs.compare.outputs.prior_approval_count }}
        run: |
          [[ "$OWNER_ID" =~ ^[1-9][0-9]*$ && "$ENVIRONMENT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRIOR_APPROVAL_COUNT" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$REVIEWED_RUN_ID" == "$GITHUB_RUN_ID" ]]
          [[ "$REVIEWED_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          # Environment rules may change after prevalidation. Job success alone
          # is not approval: require a new matching entry in this run's history.
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --output "$RUNNER_TEMP/performance-exception-approvals.json"
          approval_count="$(jq -er --argjson owner "$OWNER_ID" --argjson environment "$ENVIRONMENT_ID" '
            def valid_id: type == "number" and . > 0 and floor == .;
            if type != "array" then error("Approval history must be an array")
            elif all(.[];
              type == "object" and (.state == "approved" or .state == "rejected" or .state == "pending") and
              (.user | type == "object") and (.user.id | valid_id) and
              (.environments | type == "array") and
              all(.environments[]; type == "object" and (.id | valid_id) and (.name | type == "string")))
            then [.[] | select(.state == "approved" and .user.id == $owner and
              any(.environments[]; .id == $environment and .name == "performance-exception"))] | length
            else error("Malformed approval history")
            end' "$RUNNER_TEMP/performance-exception-approvals.json")"
          [[ "$approval_count" =~ ^(0|[1-9][0-9]*)$ ]]
          if ! jq -en --argjson current "$approval_count" --argjson previous "$PRIOR_APPROVAL_COUNT" \
            '$current > $previous' > /dev/null; then
            printf 'No fresh approval from the required owner for the exact environment and run; admission denied.\n' >&2
            exit 1
          fi
          printf 'Owner accepted the measured exception for base=%s candidate=%s head=%s run=%s attempt=%s.\n' \
            "$BASE_SHA" "$CANDIDATE_SHA" "$HEAD_SHA" "$REVIEWED_RUN_ID" "$REVIEWED_RUN_ATTEMPT"

  admission:
    name: performance admission
    needs: [compare, review-exception]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require valid ordinary policy or explicit exact-run approval
        env:
          MEASUREMENT_RESULT: ${{ needs.compare.result }}
          MEASUREMENT_STATUS: ${{ needs.compare.outputs.status }}
          MEASUREMENT_RUN_ATTEMPT: ${{ needs.compare.outputs.run_attempt }}
          REVIEW_RESULT: ${{ needs.review-exception.result }}
        run: |
          if [[ "$MEASUREMENT_RESULT" != success ]]; then
            printf 'Measurement failed, was cancelled, or is missing; admission denied.\n' >&2
            exit 1
          fi
          if [[ "$MEASUREMENT_RUN_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            printf 'Measurement belongs to an earlier attempt; rerun all jobs for fresh admission evidence.\n' >&2
            exit 1
          fi
          case "$MEASUREMENT_STATUS:$REVIEW_RESULT" in
            passed:skipped)
              printf 'Ordinary performance policy passed; admitted without an exception.\n'
              ;;
            regression:success)
              printf 'Valid regression explicitly accepted through protected exact-run owner review.\n'
              ;;
            *)
              printf 'Performance admission denied: classification=%s review=%s.\n' \
                "$MEASUREMENT_STATUS" "$REVIEW_RESULT" >&2
              exit 1
              ;;
          esac

  latency:
    permissions:
      contents: read
    name: native performance (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      PERF_TARGET: ${{ matrix.target }}
      PERF_RUNNER: ${{ matrix.runner }}
      PERF_ROOT: target/native-perf/${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      REQUEST_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
      MODE: compare
      SCENARIO: discovery-10000
      SELECTED_TARGET: all
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare target-qualified evidence and verify native runner
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          mkdir -p "$PERF_ROOT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          cat > "$PERF_ROOT/run.sh" <<'BASH'
          run() {
            {
              printf '%q ' "$@"
              printf '\n'
            } >> "$PERF_ROOT/commands.txt"
            "$@"
          }
          BASH
          exe_suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then exe_suffix='.exe'; fi
          {
            printf 'EXE_SUFFIX=%s\n' "$exe_suffix"
            printf 'TIMING_BIN_DIR=%s/native-timing-binaries\n' "$RUNNER_TEMP"
            printf 'PERF_TOOL=%s/native-perf-tools/release/bend2-perf%s\n' "$RUNNER_TEMP" "$exe_suffix"
          } >> "$GITHUB_ENV"
      - name: Install and verify pinned native Rust host
        id: tools
        run: |
          source "$PERF_ROOT/run.sh"
          run rustup toolchain install "1.98.1-$PERF_TARGET" --profile minimal
          run rustup override set "1.98.1-$PERF_TARGET"
          run rustc -vV
          run cargo build --locked --release -p bend2-perf --target-dir "$RUNNER_TEMP/native-perf-tools" \
            2>&1 | tee "$PERF_ROOT/tool-build.log"
      - name: Record expected target-qualified evidence
        run: '"$PERF_TOOL" workflow prepare'
      - name: Identify Rust dependency paths without object caching
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Verify repeated evidence CLI contracts on the native host
        id: repeated-evidence
        run: |
          source "$PERF_ROOT/run.sh"
          run cargo test --locked -p bend2-perf --no-fail-fast \
            --test paired_contract --test paired_admission --test paired_dashboard --test paired_collector \
            --target-dir "$RUNNER_TEMP/native-perf-tools" \
            2>&1 | tee "$PERF_ROOT/paired-cli-tests.log"
      - name: Build independent baseline and candidate default release executables
        id: latency-binaries
        run: |
          source "$PERF_ROOT/run.sh"
          mkdir -p "$TIMING_BIN_DIR"
          run git fetch --no-tags origin "$BASE_SHA"
          run git worktree add --detach "$RUNNER_TEMP/native-main" "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/native-main" rev-parse HEAD)" = "$BASE_SHA"
          run cargo build --locked --release --bin bend2-lsp \
            --manifest-path "$RUNNER_TEMP/native-main/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/native-target-main"
          cp "$RUNNER_TEMP/native-target-main/release/bend2-lsp$EXE_SUFFIX" \
            "$TIMING_BIN_DIR/main$EXE_SUFFIX"
          run cargo build --locked --release --bin bend2-lsp \
            --target-dir "$RUNNER_TEMP/native-target-candidate"
          cp "$RUNNER_TEMP/native-target-candidate/release/bend2-lsp$EXE_SUFFIX" \
            "$TIMING_BIN_DIR/candidate$EXE_SUFFIX"
          run "$PERF_TOOL" native memory provenance \
            --baseline-revision "$BASE_SHA" --candidate-revision "$CANDIDATE_SHA" \
            --commands-file "$PERF_ROOT/commands.txt" --binary-dir "$TIMING_BIN_DIR" \
            --output "$PERF_ROOT/provenance.json"
      - name: Measure alternating baseline and candidate LSP latency on this runner
        id: latency
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" native latency \
            --baseline-binary "$TIMING_BIN_DIR/main$EXE_SUFFIX" \
            --candidate-binary "$TIMING_BIN_DIR/candidate$EXE_SUFFIX" \
            --baseline-output "$PERF_ROOT/baseline.json" \
            --candidate-output "$PERF_ROOT/candidate.json" \
            --rounds 7 --samples 32 --warmup 8
      - name: Report latency without a numeric regression gate
        id: latency-report
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" reports latency \
            "$PERF_ROOT/baseline.json" "$PERF_ROOT/candidate.json" \
            --json-output "$PERF_ROOT/latency-report.json" \
            --markdown-output "$PERF_ROOT/latency-report.md"
          cat "$PERF_ROOT/latency-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect alternating cold discovery and warm workspace evidence
        id: discovery
        if: ${{ !cancelled() && steps.latency-binaries.outcome == 'success' }}
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" native discovery \
            --baseline-binary "$TIMING_BIN_DIR/main$EXE_SUFFIX" \
            --candidate-binary "$TIMING_BIN_DIR/candidate$EXE_SUFFIX" \
            --baseline-revision "$BASE_SHA" --candidate-revision "$CANDIDATE_SHA" \
            --output-dir "$PERF_ROOT/discovery" --rounds 7 --samples 32 --warmup 8
      - name: Generate unified native report including failed collection
        id: report
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          inventory_status=0
          "$PERF_TOOL" workflow finalize || inventory_status=$?
          "$PERF_TOOL" dashboard "$PERF_ROOT" --target-only
          printf '### Native performance evidence\n\nTarget: %s\n\nDownload this job artifact for index.html, unified-report.json, summary.md, and validated raw evidence.\n' "$PERF_TARGET" >> "$GITHUB_STEP_SUMMARY"
          exit "$inventory_status"
      - name: Inventory raw native evidence and failures
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: '"$PERF_TOOL" workflow finalize'
      - name: Preserve unified native latency and process-memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ env.REQUEST_ID }}-${{ matrix.target }}
          path: target/native-perf/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

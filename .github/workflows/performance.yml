name: performance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install matching Iai-Callgrind runner
        run: cargo install --locked --version 0.16.1 iai-callgrind-runner
      - name: Measure main baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git checkout "$BASE_SHA"
          cargo bench --locked --bench analysis -- \
            --save-baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --output-format=json \
            --save-summary=pretty-json
          git show "$CANDIDATE_SHA:scripts/performance_policy.py" > "$RUNNER_TEMP/performance_policy.py"
          python3 "$RUNNER_TEMP/performance_policy.py" \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --write-baseline-manifest="$BASELINE_MANIFEST"
      - name: Compare pull request with main
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git checkout "$CANDIDATE_SHA"
          cargo bench --locked --bench analysis -- \
            --baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --callgrind-limits='ir=2%' \
            --output-format=json \
            --save-summary=pretty-json
          python3 scripts/performance_policy.py \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --baseline-manifest="$BASELINE_MANIFEST" --baseline-name=main

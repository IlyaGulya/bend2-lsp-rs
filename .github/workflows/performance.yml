name: performance

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  compare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUEST_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
      MODE: callgrind
      SCENARIO: analysis-hot-paths
      SELECTED_TARGET: all
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      PERF_TARGET: x86_64-unknown-linux-gnu
      PERF_RUNNER: ubuntu-24.04
      PERF_ROOT: target/iai/bend2-lsp/analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Identify Rust dependency paths without object caching
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Configure isolated Iai runner install
        run: |
          printf 'CARGO_INSTALL_ROOT=%s/ci-performance-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/ci-performance-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Restore pinned Iai runner and Cargo install metadata
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-performance-tools
          key: iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-${{ hashFiles('scripts/install-tools.sh') }}
          restore-keys: |
            iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-
      - name: Install matching Iai-Callgrind runner
        run: ./scripts/install-tools.sh performance
      - name: Build candidate Rust performance tooling independently
        run: |
          mkdir -p "$PERF_ROOT"
          cargo build --locked --release -p bend2-perf --target-dir "$RUNNER_TEMP/perf-tools-target" \
            2>&1 | tee "$PERF_ROOT/tool-build.log"
          cp "$RUNNER_TEMP/perf-tools-target/release/bend2-perf" "$RUNNER_TEMP/bend2-perf"
      - name: Prepare durable Callgrind evidence inventory
        run: '"$RUNNER_TEMP/bend2-perf" workflow prepare'
      - name: Measure main baseline
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git checkout "$BASE_SHA"
          cargo bench --locked --bench analysis -- \
            --save-baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --output-format=json \
            --save-summary=pretty-json
          "$RUNNER_TEMP/bend2-perf" policy \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --write-baseline-manifest="$BASELINE_MANIFEST"
      - name: Compare pull request with main
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git checkout "$CANDIDATE_SHA"
          benchmark_status=0
          cargo bench --locked --bench analysis -- \
            --baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --callgrind-limits='ir=2%' \
            --output-format=json \
            --save-summary=pretty-json || benchmark_status=$?
          # Iai exits 3 for a regression. Still report the independent cache gates.
          if [[ "$benchmark_status" != 0 && "$benchmark_status" != 3 ]]; then
            exit "$benchmark_status"
          fi
          policy_status=0
          "$RUNNER_TEMP/bend2-perf" policy \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --baseline-manifest="$BASELINE_MANIFEST" --baseline-name=main \
            --artifact-manifest="$PERF_ROOT/artifact-manifest.json" \
            --verdict="$PERF_ROOT/callgrind-policy.json" || policy_status=$?
          printf 'benchmark_exit_code=%s\npolicy_exit_code=%s\n' \
            "$benchmark_status" "$policy_status" >> "$GITHUB_OUTPUT"
          if [[ "$policy_status" != 0 ]]; then
            exit "$policy_status"
          fi
          exit "$benchmark_status"
      - name: Record unchanged Callgrind gate outcomes and raw identities
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: '"$RUNNER_TEMP/bend2-perf" workflow finalize'
      - name: Preserve raw baseline and candidate Callgrind evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/iai/bend2-lsp/analysis/analysis_hot_paths/
            target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
            target/iai/bend2-lsp/analysis/callgrind-policy.json
            target/iai/bend2-lsp/analysis/artifact-manifest.json
            target/iai/bend2-lsp/analysis/tool-build.log
          if-no-files-found: error
          retention-days: 14

  latency:
    permissions:
      contents: read
    name: native performance (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      PERF_TARGET: ${{ matrix.target }}
      PERF_RUNNER: ${{ matrix.runner }}
      PERF_ROOT: target/native-perf/${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      REQUEST_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
      MODE: compare
      SCENARIO: discovery-10000
      SELECTED_TARGET: all
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare target-qualified evidence and verify native runner
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          mkdir -p "$PERF_ROOT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          cat > "$PERF_ROOT/run.sh" <<'BASH'
          run() {
            {
              printf '%q ' "$@"
              printf '\n'
            } >> "$PERF_ROOT/commands.txt"
            "$@"
          }
          BASH
          exe_suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then exe_suffix='.exe'; fi
          {
            printf 'EXE_SUFFIX=%s\n' "$exe_suffix"
            printf 'TIMING_BIN_DIR=%s/native-timing-binaries\n' "$RUNNER_TEMP"
            printf 'PERF_TOOL=%s/native-perf-tools/release/bend2-perf%s\n' "$RUNNER_TEMP" "$exe_suffix"
          } >> "$GITHUB_ENV"
      - name: Install and verify pinned native Rust host
        id: tools
        run: |
          source "$PERF_ROOT/run.sh"
          run rustup toolchain install "1.98.1-$PERF_TARGET" --profile minimal
          run rustup override set "1.98.1-$PERF_TARGET"
          run rustc -vV
          run cargo build --locked --release -p bend2-perf --target-dir "$RUNNER_TEMP/native-perf-tools" \
            2>&1 | tee "$PERF_ROOT/tool-build.log"
      - name: Record expected target-qualified evidence
        run: '"$PERF_TOOL" workflow prepare'
      - name: Identify Rust dependency paths without object caching
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads only
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Build independent baseline and candidate default release executables
        id: latency-binaries
        run: |
          source "$PERF_ROOT/run.sh"
          mkdir -p "$TIMING_BIN_DIR"
          run git fetch --no-tags origin "$BASE_SHA"
          run git worktree add --detach "$RUNNER_TEMP/native-main" "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/native-main" rev-parse HEAD)" = "$BASE_SHA"
          run cargo build --locked --release --bin bend2-lsp \
            --manifest-path "$RUNNER_TEMP/native-main/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/native-target-main"
          cp "$RUNNER_TEMP/native-target-main/release/bend2-lsp$EXE_SUFFIX" \
            "$TIMING_BIN_DIR/main$EXE_SUFFIX"
          run cargo build --locked --release --bin bend2-lsp \
            --target-dir "$RUNNER_TEMP/native-target-candidate"
          cp "$RUNNER_TEMP/native-target-candidate/release/bend2-lsp$EXE_SUFFIX" \
            "$TIMING_BIN_DIR/candidate$EXE_SUFFIX"
          run "$PERF_TOOL" native memory provenance \
            --baseline-revision "$BASE_SHA" --candidate-revision "$CANDIDATE_SHA" \
            --commands-file "$PERF_ROOT/commands.txt" --binary-dir "$TIMING_BIN_DIR" \
            --output "$PERF_ROOT/provenance.json"
      - name: Measure alternating baseline and candidate LSP latency on this runner
        id: latency
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" native latency \
            --baseline-binary "$TIMING_BIN_DIR/main$EXE_SUFFIX" \
            --candidate-binary "$TIMING_BIN_DIR/candidate$EXE_SUFFIX" \
            --baseline-output "$PERF_ROOT/baseline.json" \
            --candidate-output "$PERF_ROOT/candidate.json" \
            --rounds 7 --samples 32 --warmup 8
      - name: Report latency without a numeric regression gate
        id: latency-report
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" reports latency \
            "$PERF_ROOT/baseline.json" "$PERF_ROOT/candidate.json" \
            --json-output "$PERF_ROOT/latency-report.json" \
            --markdown-output "$PERF_ROOT/latency-report.md"
          cat "$PERF_ROOT/latency-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect alternating cold discovery and warm workspace evidence
        id: discovery
        if: ${{ !cancelled() && steps.latency-binaries.outcome == 'success' }}
        run: |
          source "$PERF_ROOT/run.sh"
          run "$PERF_TOOL" native discovery \
            --baseline-binary "$TIMING_BIN_DIR/main$EXE_SUFFIX" \
            --candidate-binary "$TIMING_BIN_DIR/candidate$EXE_SUFFIX" \
            --baseline-revision "$BASE_SHA" --candidate-revision "$CANDIDATE_SHA" \
            --output-dir "$PERF_ROOT/discovery" --rounds 7 --samples 32 --warmup 8
      - name: Generate unified native report including failed collection
        id: report
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          inventory_status=0
          "$PERF_TOOL" workflow finalize || inventory_status=$?
          "$PERF_TOOL" dashboard "$PERF_ROOT" --target-only
          printf '### Native performance evidence\n\nTarget: %s\n\nDownload this job artifact for index.html, unified-report.json, summary.md, and validated raw evidence.\n' "$PERF_TARGET" >> "$GITHUB_STEP_SUMMARY"
          exit "$inventory_status"
      - name: Inventory raw native evidence and failures
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: '"$PERF_TOOL" workflow finalize'
      - name: Preserve unified native latency and process-memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ env.REQUEST_ID }}-${{ matrix.target }}
          path: target/native-perf/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

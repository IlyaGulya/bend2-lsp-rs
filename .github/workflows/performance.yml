name: performance

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  compare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install matching Iai-Callgrind runner
        run: cargo install --locked --version 0.16.1 iai-callgrind-runner
      - name: Measure main baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git checkout "$BASE_SHA"
          cargo bench --locked --bench analysis -- \
            --save-baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --output-format=json \
            --save-summary=pretty-json
          git show "$CANDIDATE_SHA:scripts/performance_policy.py" > "$RUNNER_TEMP/performance_policy.py"
          python3 "$RUNNER_TEMP/performance_policy.py" \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --write-baseline-manifest="$BASELINE_MANIFEST"
      - name: Compare pull request with main
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BASELINE_MANIFEST: target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
        run: |
          git checkout "$CANDIDATE_SHA"
          benchmark_status=0
          cargo bench --locked --bench analysis -- \
            --baseline=main \
            --callgrind-args='--cache-sim=yes' \
            --callgrind-limits='ir=2%' \
            --output-format=json \
            --save-summary=pretty-json || benchmark_status=$?
          # Iai exits 3 for a regression. Still report the independent cache gates.
          if [[ "$benchmark_status" != 0 && "$benchmark_status" != 3 ]]; then
            exit "$benchmark_status"
          fi
          python3 scripts/performance_policy.py \
            target/iai/bend2-lsp/analysis/analysis_hot_paths \
            --baseline-manifest="$BASELINE_MANIFEST" --baseline-name=main
          exit "$benchmark_status"
      - name: Preserve raw baseline and candidate Callgrind evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/iai/bend2-lsp/analysis/analysis_hot_paths/
            target/iai/bend2-lsp/analysis/analysis_hot_paths-baseline.json
          if-no-files-found: error
          retention-days: 14

  latency:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build baseline and candidate release executables
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/latency-binaries" target/lsp-latency
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/latency-main" "$BASE_SHA"
          cargo build --locked --release --bin bend2-lsp \
            --manifest-path "$RUNNER_TEMP/latency-main/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/latency-target-main"
          cp "$RUNNER_TEMP/latency-target-main/release/bend2-lsp" \
            "$RUNNER_TEMP/latency-binaries/main"
          cargo build --locked --release --bin bend2-lsp \
            --target-dir "$RUNNER_TEMP/latency-target-candidate"
          cp "$RUNNER_TEMP/latency-target-candidate/release/bend2-lsp" \
            "$RUNNER_TEMP/latency-binaries/candidate"
          printf '{"baseline":"%s","candidate":"%s"}\n' \
            "$BASE_SHA" "$CANDIDATE_SHA" > target/lsp-latency/revisions.json
      - name: Measure alternating baseline and candidate LSP latency
        run: |
          python3 scripts/lsp_latency.py \
            --baseline-binary "$RUNNER_TEMP/latency-binaries/main" \
            --candidate-binary "$RUNNER_TEMP/latency-binaries/candidate" \
            --baseline-output target/lsp-latency/baseline.json \
            --candidate-output target/lsp-latency/candidate.json \
            --rounds 7 --samples 32 --warmup 8
      - name: Report latency changes without a numeric regression gate
        run: |
          python3 scripts/latency_report.py \
            target/lsp-latency/baseline.json target/lsp-latency/candidate.json \
            --json-output target/lsp-latency/report.json \
            --markdown-output target/lsp-latency/report.md
          cat target/lsp-latency/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw latency samples and comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/lsp-latency/
          if-no-files-found: error

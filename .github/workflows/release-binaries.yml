name: release-binaries

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string
    secrets:
      BUILDFETCH_TOKEN_READONLY:
        required: false
      BUILDFETCH_TOKEN_READWRITE:
        required: false

permissions: {}

jobs:
  native:
    permissions:
      contents: read
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: &native-platforms
        include:
          - runner: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
            python: python
    defaults:
      run:
        shell: bash
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify exact source and native runner
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          "$PYTHON" scripts/release.py verify
      - name: Verify release integrity regression cases
        run: '"$PYTHON" -m unittest discover -s scripts -p test_release.py'
      - name: Install pinned native Rust toolchain
        run: |
          rustup toolchain install "1.98.1-$RELEASE_TARGET" --profile minimal
          rustup override set "1.98.1-$RELEASE_TARGET"
          rustc -vV
          "$PYTHON" -c 'import os, subprocess; host = next(line.removeprefix("host: ") for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines() if line.startswith("host: ")); assert host == os.environ["RELEASE_TARGET"], host'
      - name: Configure native CI cache identity
        id: ci-cache
        env:
          ENABLE_SCCACHE: 'true'
          CACHE_WRITABLE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          BUILDFETCH_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.BUILDFETCH_TOKEN_READWRITE || secrets.BUILDFETCH_TOKEN_READONLY }}
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh', 'scripts/ci-cache.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Enable native compiler cache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: v0.18.0
      - name: Install pinned native test runner
        run: |
          "$PYTHON" scripts/bootstrap_nextest.py --target "$RELEASE_TARGET" --destination "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Report pinned native test runner
        run: cargo nextest --version
      - name: Build locked optimized binary
        run: cargo build --locked --release --bin bend2-lsp
      - name: Stage direct release executable for E2E
        run: '"$PYTHON" scripts/release.py package'
      - name: Run full native release test suite
        run: cargo nextest run --workspace --all-features --locked --release --profile ci
      - name: Run native release documentation tests
        run: cargo test --doc --locked --release
      - name: Mandatory native E2E against direct release executable
        run: cargo nextest run --locked --test release_e2e --profile ci
      - name: Upload tested executable, checksum, and internal release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Save Cargo downloads from trusted main
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
  installers:
    permissions:
      contents: read
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.channel }}-@(x86_64|aarch64)-*
          path: dist
          merge-multiple: true
      - name: Install pinned global installer generator
        run: ./scripts/install-tools.sh dist
      - name: Generate installers bound to all six native-tested archives
        run: python3 scripts/dist_installers.py
      - name: Upload checksum-bound installers and internal identity metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.channel }}-installers
          path: |
            dist/bend2-lsp-installer.*
            dist/installers.metadata.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  installer-e2e:
    permissions:
      contents: read
    needs: installers
    name: installer E2E (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: *native-platforms
    defaults:
      run:
        shell: bash
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify exact source and native runner
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          "$PYTHON" scripts/release.py verify
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.channel }}-*
          path: dist
          merge-multiple: true
      - name: Install pinned native Rust toolchain
        run: |
          rustup toolchain install "1.98.1-$RELEASE_TARGET" --profile minimal
          rustup override set "1.98.1-$RELEASE_TARGET"
          rustc -vV
          "$PYTHON" -c 'import os, subprocess; host = next(line.removeprefix("host: ") for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines() if line.startswith("host: ")); assert host == os.environ["RELEASE_TARGET"], host'
      - name: Configure native CI cache identity
        id: ci-cache
        env:
          ENABLE_SCCACHE: 'true'
          CACHE_WRITABLE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          BUILDFETCH_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.BUILDFETCH_TOKEN_READWRITE || secrets.BUILDFETCH_TOKEN_READONLY }}
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh', 'scripts/ci-cache.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Enable native compiler cache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: v0.18.0
      - name: Install pinned native test runner
        run: |
          "$PYTHON" scripts/bootstrap_nextest.py --target "$RELEASE_TARGET" --destination "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: Report pinned native test runner
        run: cargo nextest --version
      - name: Reject altered archive, install verified archive and exercise installed LSP
        run: '"$PYTHON" scripts/installer_e2e.py'
      - name: Save Cargo downloads from trusted main
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

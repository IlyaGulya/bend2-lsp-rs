name: release

on:
  # Only a successful same-repository main push can reach privileged release jobs.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - name: Create narrowly scoped release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Maintain Rust release PR and create draft release only
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Select exact SHA draft or recover interrupted publication
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_CHANNEL: stable
        run: python3 scripts/release.py candidate
  binaries:
    permissions:
      contents: read
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: $/.github/workflows/release-binaries.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: stable
    secrets:
      BUILDFETCH_TOKEN_READONLY: ${{ secrets.BUILDFETCH_TOKEN_READONLY }}
  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stable-*
          path: dist
          merge-multiple: true
      - name: Publish stable release only after all native E2E succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: stable
        run: python3 scripts/release.py publish

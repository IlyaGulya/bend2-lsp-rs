name: performance-calibration-report-replay

# Unprivileged, exact-source diagnostic replay of the already-collected control
# evidence from run 40545135794 attempt 1. It never remeasures, never relabels
# that failed workflow, never spoofs GITHUB_SHA and never retries to green.
# Compact inputs are produced from the original sealed ZIP bytes without bulk
# extraction, then the unchanged authoritative Rust reporter renders a new,
# honest verdict. The original full raw artifacts remain untouched.

run-name: performance-calibration-report-replay / control-run-40545135794-1 / ${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/control-report-40545135794]

permissions: {}

env:
  SOURCE_REPOSITORY: IlyaGulya/bend2-lsp-rs
  SOURCE_RUN_ID: '40545135794'
  SOURCE_RUN_ATTEMPT: '1'
  SOURCE_REVISION: 12afbf96e8e5ed18462de42bdc1b265791673ff9
  SOURCE_WORKFLOW_PATH: .github/workflows/performance-calibration.yml
  WRAPPER_WORKFLOW_PATH: .github/workflows/performance-calibration-report-replay.yml

jobs:
  export:
    name: export ${{ matrix.job }} closure
    if: github.repository == 'IlyaGulya/bend2-lsp-rs'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job:
          - discovery-01
          - discovery-02
          - discovery-03
          - validation-01
          - validation-02
          - validation-03
    env:
      LOGICAL_JOB: ${{ matrix.job }}
      WRAPPER_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Pin the original failed run and its four sealed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$WRAPPER_SHA"
          mkdir -p "$RUNNER_TEMP/replay"
          gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$RUNNER_TEMP/replay/source-run.json"
          gh api --paginate --slurp \
            "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/replay/source-artifacts.json"
          python3 scripts/calibration_report_input.py plan \
            --run-json "$RUNNER_TEMP/replay/source-run.json" \
            --artifacts-json "$RUNNER_TEMP/replay/source-artifacts.json" \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-revision "$SOURCE_REVISION" \
            --logical-job "$LOGICAL_JOB" \
            --shard-count 4 \
            --output "$RUNNER_TEMP/replay/plan.json"
      - name: Download original ZIP bytes without extraction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-calibration-40545135794-1-${{ matrix.job }}-shard-*
          path: ${{ runner.temp }}/replay/raw
          repository: IlyaGulya/bend2-lsp-rs
          run-id: 40545135794
          github-token: ${{ github.token }}
          merge-multiple: false
          skip-decompress: true
          digest-mismatch: error
      - name: Export only the required dependency closure
        id: export
        run: |
          python3 scripts/calibration_report_input.py export \
            --plan "$RUNNER_TEMP/replay/plan.json" \
            --raw-dir "$RUNNER_TEMP/replay/raw" \
            --output "$RUNNER_TEMP/replay/input" \
            --producer-workflow "$WRAPPER_WORKFLOW_PATH" \
            --producer-revision "$WRAPPER_SHA" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT"
          cp "$RUNNER_TEMP/replay/source-run.json" \
            "$RUNNER_TEMP/replay/input/$LOGICAL_JOB/source-run.json"
          cp "$RUNNER_TEMP/replay/plan.json" \
            "$RUNNER_TEMP/replay/input/$LOGICAL_JOB/source-plan.json"
      - name: Preserve compact replay inputs
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-calibration-replay-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
          path: ${{ runner.temp }}/replay/input/${{ matrix.job }}/
          if-no-files-found: error
          retention-days: 14

  report:
    name: authoritative replay report
    needs: export
    if: always() && github.repository == 'IlyaGulya/bend2-lsp-rs'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRAPPER_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check out the exact collected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IlyaGulya/bend2-lsp-rs
          ref: 12afbf96e8e5ed18462de42bdc1b265791673ff9
          path: source
          persist-credentials: false
      - name: Prove the wrapper and collected source revisions
        run: |
          mkdir -p target/performance-calibration-replay
          test "$(git rev-parse HEAD)" = "$WRAPPER_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          printf '{\n  "source_repository": "%s",\n  "source_run_id": "%s",\n  "source_run_attempt": "%s",\n  "source_revision": "%s",\n  "wrapper_revision": "%s",\n  "replay_run_id": "%s",\n  "replay_run_attempt": "%s"\n}\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" \
            "$SOURCE_REVISION" "$WRAPPER_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > target/performance-calibration-replay/provenance.json
      - name: Install pinned Rust and build the unchanged reporter
        working-directory: source
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --locked --release -p bend2-perf \
            --target-dir "$RUNNER_TEMP/replay-tools"
      - name: Download compact replay inputs only
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-calibration-replay-input-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/replay-input
          merge-multiple: false
          digest-mismatch: error
      - name: Verify compact replay inputs before the authoritative report
        if: always()
        run: |
          python3 scripts/calibration_report_input.py verify \
            --root "$RUNNER_TEMP/replay-input" \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-revision "$SOURCE_REVISION" \
            --expected-producer-run-id "$GITHUB_RUN_ID" \
            --expected-producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-producer-workflow "$WRAPPER_WORKFLOW_PATH" \
            --expected-producer-revision "$WRAPPER_SHA" \
            --expected-discovery-jobs 3 \
            --expected-validation-jobs 3 \
            --expected-shards 4 \
            --expected-source-format artifact-zip \
            --json-output target/performance-calibration-replay/verification.json
      - name: Run the unchanged authoritative calibration report on all 24 shards
        if: always()
        run: |
          "$RUNNER_TEMP/replay-tools/release/bend2-perf" calibration report \
            "$RUNNER_TEMP/replay-input" \
            --method paired-median-105-v1 \
            --expected-discovery-jobs 3 --expected-validation-jobs 3 \
            --expected-pairs 105 --expected-shards 4 \
            --expected-workloads 99 --require-all-benchmarks \
            --require-control-validation \
            --json-output target/performance-calibration-replay/report.json \
            --markdown-output target/performance-calibration-replay/report.md
      - name: Publish the replay verdict
        if: always()
        run: |
          if [[ -f target/performance-calibration-replay/report.md ]]; then
            cat target/performance-calibration-replay/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve the replay report, verification and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-calibration-replay-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/performance-calibration-replay/
          if-no-files-found: error
          retention-days: 14

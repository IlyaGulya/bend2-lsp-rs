name: lint-callgrind-probe

on:
  push:
    branches: [experiment/lint-callgrind-20261019]

permissions: {}

jobs:
  diagnostic:
    name: Original 54-workload diagnostic (not admission)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: c6d55edd0f52fcf7aa4c55a210e82f43140232d5
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Identify dependency-only cache paths
        id: ci-cache
        run: bash scripts/ci-cache.sh
      - name: Restore Cargo downloads without object caching
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.ci-cache.outputs.cargo-cache-paths }}
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-
      - name: Configure isolated profiler installation
        run: printf 'VALGRIND_INSTALL_ROOT=%s/ci-valgrind\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore source-bound pinned Valgrind
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VALGRIND_INSTALL_ROOT }}
          key: valgrind-v1-${{ runner.os }}-${{ runner.arch }}-3.27.1-4522e345fe31bc10478f21ab261cf7b3e509d80fe98fd0c7c9778ac9a9f90e1d8fa6e54a37c2e23114c01c95131035103fc1e78661710d7f45f5d564a31c1015-${{ hashFiles('scripts/install-tools.sh', 'scripts/install-valgrind.sh') }}
      - name: Validate exact native profiler bytes
        run: |
          ./scripts/install-tools.sh valgrind
          test "$("$VALGRIND_INSTALL_ROOT/bin/valgrind" --version)" = valgrind-3.27.1
          printf '%s/bin\n' "$VALGRIND_INSTALL_ROOT" >> "$GITHUB_PATH"
      - name: Configure isolated Iai install
        run: |
          printf 'CARGO_INSTALL_ROOT=%s/ci-performance-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/ci-performance-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Restore pinned Iai runner
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-performance-tools
          key: iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-${{ hashFiles('scripts/install-tools.sh') }}
          restore-keys: |
            iai-runner-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ci-cache.outputs.toolchain-key }}-0.16.1-
      - name: Validate exact Iai runner version
        run: ./scripts/install-tools.sh performance
      - name: Run one complete unmodified-harness diagnostic pair
        run: python3 .github/diagnostics/lint-callgrind-probe.py
      - name: Retain diagnostic-only source identities and raw profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-only-callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/callgrind-diagnostic/
          if-no-files-found: error
          retention-days: 14
